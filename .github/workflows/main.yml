name: "Run TODO to Issue"
# Only after a merge to main, so drafts on branches and pull requests don't open issues.
on:
    push:
        branches: [main]
permissions:
    contents: read
    issues: write
jobs:
    build:
        runs-on: "ubuntu-latest"
        steps:
            - uses: "actions/checkout@v4"
            - name: "TODO to Issue"
              uses: "alstr/todo-to-issue-action@v4"
