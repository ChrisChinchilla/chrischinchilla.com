name: "Video and article matches"

# Weekly report of recent YouTube videos that have no article yet, plus automatic and candidate
# pairings to review (see scripts/match-videos.mjs). Report only: it never edits content. The
# result is kept in one open issue, updated in place, so it doesn't pile up.
#
# Needs a repository secret named GOOGLE_API (the same YouTube Data API key the Netlify build uses).

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      GOOGLE_API: ${{ secrets.GOOGLE_API }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build report
        run: |
          if [ -z "$GOOGLE_API" ]; then
            echo "GOOGLE_API secret is not set; skipping." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          since=$(date -u -d '90 days ago' +%F)
          npm run --silent match-videos -- --since "$since" --new-only > report.txt
          {
            echo "Videos published since $since, checked against the articles on the site."
            echo "Generated by .github/workflows/video-matches.yml on $(date -u +%F). Edited in place each week."
            echo
            echo "To pair a video, add \`youtubeId: <id>\` to the article's frontmatter (or \`relatedYoutubeIds\`"
            echo "for a further video). \`youtubeId: false\` stops automatic matching for an article."
            echo
            echo '```'
            cat report.txt
            echo '```'
          } > body.md
          cat body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Update the report issue
        run: |
          [ -f body.md ] || exit 0
          title="Video and article matching report"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi
